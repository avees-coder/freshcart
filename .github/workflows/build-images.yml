# Builds both images and pushes them to GitHub Container Registry (ghcr.io).
# Trigger: push a tag like v1 / v2   (git tag v2 && git push origin v2), or run manually.
name: build-images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: true
        default: "dev"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Work out names (ghcr.io requires lowercase)
        id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"; else echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/freshcart-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/freshcart-${{ matrix.service }}:sha-${{ github.sha }}
