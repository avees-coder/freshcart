# Apply AFTER metrics-server is running:  kubectl apply -n freshcart -f deploy/k8s/60-hpa.yaml
# From now on the HPA owns api's replica count — "kubectl scale" will be overridden.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: freshcart
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }   # % of the 100m REQUEST
