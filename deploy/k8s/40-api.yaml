apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  selector:
    matchLabels: { app: api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never drop below 3 during a rollout
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: freshcart-api            # rewritten by kustomization.yaml "images:"
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: freshcart-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } }
          # Liveness: restart me if the PROCESS is stuck. Never tied to the DB,
          # or a DB outage would restart-loop every API pod.
          livenessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: send me traffic only when I can reach the DB.
          readinessProbe:
            httpGet: { path: /api/ready, port: 3000 }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 100m, memory: 96Mi }   # what the scheduler reserves
            limits:   { cpu: 500m, memory: 192Mi }  # the ceiling at runtime
      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 3000
